name: Build Android Artifacts

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build secure Release APK & AAB (requires configured repository secrets)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Find and Stage Debug APK
        shell: bash
        run: |
          set -e
          echo "Searching for debug APK..."
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" -print -quit 2>/dev/null || true)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk -type f -name "*debug*.apk" -print -quit 2>/dev/null || true)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No debug APK found!"
            exit 1
          fi

          mkdir -p artifacts
          cp "$APK" artifacts/slidecraft-debug.apk
          ls -lh artifacts/slidecraft-debug.apk

      - name: Verify Debug APK
        shell: bash
        run: |
          if [ ! -f "artifacts/slidecraft-debug.apk" ]; then
            echo "::error::Debug APK file does not exist!"
            exit 1
          fi
          SIZE=$(stat -c%s artifacts/slidecraft-debug.apk)
          echo "Debug APK size: $SIZE bytes"
          if [ "$SIZE" -le 0 ]; then
            echo "::error::Debug APK is empty!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slidecraft-debug-apk
          path: artifacts/slidecraft-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-release:
    name: Build Secure Release Artifacts (APK & AAB)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.build_release == 'true' || startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Required Signing Secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.STORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Required release signing secrets are missing! Please configure KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in GitHub repository Secrets."
            exit 1
          fi
          echo "Release signing secrets verified."

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Decode Release Keystore
        shell: bash
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          if [ ! -s my-upload-key.jks ]; then
            echo "::error::Failed to decode release keystore or file is empty!"
            exit 1
          fi

      - name: Build Secure Release APK and AAB (R8 Obfuscation & Resource Shrinking)
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Stage Release Artifacts
        shell: bash
        run: |
          set -e
          mkdir -p release-artifacts
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" -print -quit 2>/dev/null || true)
          RELEASE_AAB=$(find app/build/outputs/bundle/release -type f -name "*.aab" -print -quit 2>/dev/null || true)

          if [ -z "$RELEASE_APK" ] || [ -z "$RELEASE_AAB" ]; then
            echo "::error::Release build artifacts not found!"
            exit 1
          fi

          cp "$RELEASE_APK" release-artifacts/slidecraft-release.apk
          cp "$RELEASE_AAB" release-artifacts/slidecraft-release.aab
          ls -lh release-artifacts/

      - name: Clean Up Keystore
        if: always()
        run: rm -f my-upload-key.jks

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slidecraft-release-apk
          path: release-artifacts/slidecraft-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slidecraft-release-aab
          path: release-artifacts/slidecraft-release.aab
          if-no-files-found: error
          retention-days: 14
